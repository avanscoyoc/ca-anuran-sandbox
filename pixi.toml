[workspace]
authors = ["avanscoyoc <amy.e.van.scoyoc@gmail.com>"]
channels = ["conda-forge"]
name = "ca-anuran-sandbox"
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
version = "0.1.0"

[dependencies]
python = "3.12.*"
jupyterlab = ">=4.6.4,<5"
ipykernel = ">=7.4.0,<8"
# scraping + data
requests = "*"
beautifulsoup4 = "*"
pyyaml = "*"
pandas = "*"
pyarrow = "*"
# audio
librosa = "*"
pysoundfile = "*"
ffmpeg = "*"
scikit-learn = "*"
pytest = "*"
shapely = "*"
pyproj = "*"
pyshp = "*"

[pypi-dependencies]
anuran = { path = ".", editable = true }
tensorflow = ">=2.20"
kagglehub = "*"
birdnet = "*"
ai-edge-litert = "*"
jupyter-bioacoustic = "*"
torch = "*"

[tasks]
scrape-herps = "python -m anuran.scrape.herps"
scrape-inat = "python -m anuran.scrape.inat"
scrape-xc = "python -m anuran.scrape.xenocanto"
manifest = "python -m anuran.data.manifest"
catalog = "python -m anuran.data.catalog"
inventory = "python -m anuran.data.catalog"
embed = "python -m anuran.features.embed_audio"
weak-labels = "python -m anuran.data.window_labels"
baseline = "python -m anuran.train_baseline"
export-review = "python -m anuran.data.export_review"
train-head = "python -m anuran.train_head"
background = "python -m anuran.data.background"
test = "pytest -q tests"
non-avian-ml = "python -m anuran.data.non_avian_ml"
ranges = "python -m anuran.data.ranges"
splits = "python -m anuran.eval.splits"
experiment = "python -m anuran.experiment run"
compare = "python -m anuran.experiment compare"
learning-curve = "python -m anuran.learning_curve"
